name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    # PostgreSQL jetable pour les tests d'intégration (même version qu'en dev).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: jobflow
          POSTGRES_PASSWORD: jobflow
          POSTGRES_DB: jobflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobflow -d jobflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://jobflow:jobflow@localhost:5432/jobflow_test
      TEST_DATABASE_URL: postgresql://jobflow:jobflow@localhost:5432/jobflow_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      # Failles connues de gravité haute ou critique dans les dépendances de production (SPEC-012, FR-012-07).
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
