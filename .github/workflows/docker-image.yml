name: Image Docker

# Construit l'image de production (ARM64, pour la Raspberry Pi) et vérifie qu'elle démarre.
# Sur une PR : construction et essai seulement. Sur main : publication sur GHCR (FR-010-01).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    # Machine ARM64 native (gratuite pour un dépôt public) : pas d'émulation, construction rapide.
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Nom en minuscules (exigé par GHCR) ; étiquettes : sha-<commit> toujours, latest sur main.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Essai : l'image démarre sur une base vide, applique les migrations et répond 200 sur /api/health.
      - name: Essai de démarrage
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          docker network create essai
          docker run -d --name essai-db --network essai \
            -e POSTGRES_PASSWORD=essai -e POSTGRES_DB=jobflow \
            --health-cmd "pg_isready -U postgres -d jobflow" --health-interval 2s \
            postgres:18-alpine
          until [ "$(docker inspect -f '{{.State.Health.Status}}' essai-db)" = healthy ]; do sleep 2; done
          docker run -d --name essai-app --network essai -p 3000:3000 \
            -e DATABASE_URL=postgresql://postgres:essai@essai-db:5432/jobflow "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs essai-app
          exit 1

      - name: Publication sur GHCR
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push --all-tags "$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
