# Mises à jour des dépendances (SPEC-012, FR-012-08) : une fois par mois, regroupées en une seule PR
# par écosystème, testées par la CI avant fusion. Les alertes de sécurité restent immédiates.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      # Mineures et correctifs ensemble, en une seule PR par mois.
      dependances:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Aucune version majeure proposée (décision du 2026-10-01) : elles changent le fonctionnement des
      # outils et cassent souvent la CI (ESLint 10, TypeScript 7…). On les fait à la main, quand on le décide.
      # Les mises à jour de sécurité de Dependabot ne sont pas concernées par cette règle.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    # Node reste sur sa version LTS (24) : pas de saut vers une version impaire.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
