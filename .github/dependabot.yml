# Mises à jour des dépendances (SPEC-012, FR-012-08) : une fois par mois, regroupées en une seule PR
# par écosystème, testées par la CI avant fusion. Les alertes de sécurité restent immédiates.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      # Mineures et correctifs ensemble ; une version majeure (ex. Next 17) arrive dans sa propre PR,
      # pour ne pas bloquer les correctifs du mois si elle casse la CI.
      dependances:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    # Node reste sur sa version LTS (24) : pas de saut vers une version impaire.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
