# Mises à jour des dépendances (SPEC-012, FR-012-08) : une fois par mois, regroupées en une seule PR
# par écosystème, testées par la CI avant fusion. Les alertes de sécurité restent immédiates.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      # Mineures et correctifs ensemble ; une version majeure (ex. Next 17) arrive dans sa propre PR,
      # pour ne pas bloquer les correctifs du mois si elle casse la CI.
      dependances:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # ESLint 10 casse eslint-config-next 16 (« contextOrFilename.getFilename is not a function ») :
      # à retirer quand une version d'eslint-config-next le prend en charge.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # Les types suivent le Node de l'image (24, LTS), pas la dernière version de Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    # Node reste sur sa version LTS (24) : pas de saut vers une version impaire.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
